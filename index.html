<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BacTracker - متتبع تقدم الباك</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="dark-mode-toggle" onclick="toggleDarkMode()">🌙</button>
    
    <div class="container">
        <div class="header">
            <h1>🎓 BacTracker</h1>
            <p>متتبع تقدمك في البكالوريا المغربية</p>
        </div>

        <div class="card">
            <h2>📝 اختر معلوماتك</h2>
            
            <label>المستوى الدراسي:</label>
            <select id="level">
                <option value="">-- اختر المستوى --</option>
                <option value="1bac">أولى باكالوريا</option>
                <option value="2bac">ثانية باكالوريا</option>
            </select>

            <label>المسار:</label>
            <select id="track">
                <option value="">-- اختر المسار --</option>
            </select>

            <label>اسمك:</label>
            <input type="text" id="name" placeholder="أدخل اسمك">

            <button class="btn btn-primary" onclick="startTracking()">ابدأ التتبع 🚀</button>
        </div>

        <div class="card">
            <h2>✨ مميزات BacTracker</h2>
            <ul>
                <li>✅ تتبع التقدم في كل مادة</li>
                <li>✅ حاسبة المعدل التفاعلية</li>
                <li>✅ مساعد ذكي (شات بوت) يشرحلك الدروس</li>
                <li>✅ يدعم كل المسارات</li>
                <li>✅ تصميم احترافي مع وضع ليلي</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
